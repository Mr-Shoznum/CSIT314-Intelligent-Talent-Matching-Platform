<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
        <img src="ITMP-logo.png" style="width: 200px; height: 50px;"></img>
        <nav>
            <a>Sign out</a>
            <a>Profile</a>
        </nav>
        </header>

        <div class="container">
            <h1>Create job listing</h1>
            Job Title: <input> <br> <br>
            Company Information: <input style="width: 400px; height: 100px;"> <br>
            Job Description: <input style="width: 400px; height: 100px;"> <br> 
            Required Education Level: <select>
                <option>No experience</option>
                <option>Undergraduate</option>
                <option>Bachelors degree</option>
                <option>Masters degree</option>
                <option>PHD</option>
                <option>Postgraduate</option>
            </select> <br> 
            Required Skills: <input style="width: 400px; height: 100px;"> <br> 
            Years of Experience: <input> <br> 
            Work Mode: <select>
                <option>Remote</option>
                <option>Hyrbid</option>
                <option>On-Site</option>
            </select> <br>
            Area you will be working in: <select>
                <option>Computing</option>
                <option>Healthcare</option>
                <option>Aerospace</option>
                <option>Engineering</option>
                <option>Air Traffic Control</option>
                <option>Finance</option>
                <option>Banking</option>
                <option>Agriculture</option>
                <option>Business</option>
                <option>Science</option>
                <option>History</option>
            </select> <br>
            Location:
            <select id="locationSelect">
                <option>Wollongong</option>
                <option>Sydney</option>
                <option>Canberra</option>
                <option>Melbourne</option>
                <option>Brisbane</option>
                <option>Perth</option>
            </select><br><br>
        </div>
    </body>
</html>
