<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Intelligent Talent Matching Platform</title>
    <link rel="stylesheet" href="../assests/styling/login.css">
</head>
<body>

    <header>
        <a href="index.html" class="header-logo-link">
            <img class="itmp-logo-placeholder" src="../assests/images/ITMP.png" alt="[ITMP Logo Placeholder]">
        </a>
    </header>

    <main>
        <div class="login-card">
            <h1>Login</h1>
            
            <form id="login-form">
                <div class="input-group">
                    <label for="email">Email or Username</label>
                    <input type="text" id="email" name="email" placeholder="Email or Username" required>
                </div>

                <div class="reveal-container" id="password-container">
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>

                    <button type="submit" class="btn-signin">Sign in</button>
                </div>
            </form>

            <p class="register-link">Don’t have an account? <a href="#">Register</a></p>
        </div>
    </main>

    <footer class="minimal-footer">
        <div class="footer-links">
            <a href="#">Terms of Service</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Cookie Policy</a>
            <a href="#">Candidate Terms</a>
            <a href="#">Employer Terms</a>
            <a href="#">Licenses</a>
        </div>
        <div class="footer-copyright">
            &copy; 2026 Intelligent Talent Matching Platform (ITMP). All rights reserved.
        </div>
    </footer>

    <script>
        const emailInput = document.getElementById('email');
        const passwordContainer = document.getElementById('password-container');
        const passwordInput = document.getElementById('password');

        emailInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); 
                
                if (this.value.trim() !== '') {
                    passwordContainer.classList.add('show');
                    
                    setTimeout(() => {
                        passwordInput.focus();
                    }, 300); 
                }
            }
        });
    </script>

</body>
</html>
