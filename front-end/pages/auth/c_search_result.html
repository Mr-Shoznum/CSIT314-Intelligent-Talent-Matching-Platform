<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search – ITMP</title>
    <link rel="stylesheet" href="../../assests/styling/global.css">
    <link rel="stylesheet" href="../../assests/styling/dashboard.css">
    <link rel="icon" type="image/x-icon" href="../../assests/images/ITMP-icon-logo.ico">
    <style>
        .search-main { padding: 2rem; align-items: flex-start; }
        .search-wrapper { width: 100%; max-width: 1200px; margin: 0 auto; }
        .back-link { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--primary); font-weight: bold; font-size: 0.9rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { text-decoration: underline; }
        .search-hero { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%); border-radius: var(--radius-card); padding: 2rem 2.5rem; margin-bottom: 1.5rem; color: white; }
        .search-hero h1 { font-size: 1.5rem; margin-bottom: 1.25rem; text-align: left; color: white; }
        .mode-toggle { display: inline-flex; background: rgba(255,255,255,0.15); border-radius: 30px; padding: 4px; margin-bottom: 1.25rem; gap: 4px; }
        .mode-btn { padding: 0.45rem 1.25rem; border-radius: 24px; border: none; background: transparent; color: rgba(255,255,255,0.75); font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
        .mode-btn.active { background: white; color: var(--primary); }
        .search-input-row { display: flex; gap: 0.75rem; }
        .search-input-row input { flex: 1; padding: 0.75rem 1.25rem; border-radius: var(--radius-btn); border: none; font-size: 1rem; outline: none; }
        .btn-search-main { background: white; color: var(--primary); border: none; padding: 0.75rem 1.75rem; border-radius: var(--radius-btn); font-weight: bold; font-size: 0.95rem; cursor: pointer; white-space: nowrap; }
        .search-body { display: grid; grid-template-columns: 280px 1fr; gap: 1.5rem; align-items: start; }
        .filter-sidebar { display: flex; flex-direction: column; gap: 1rem; }
        .filter-card { padding: 1.5rem; }
        .filter-card h3 { font-size: 0.95rem; font-weight: bold; color: var(--text-main); margin-bottom: 1rem; }
        .filter-group { margin-bottom: 1.25rem; }
        .filter-group:last-child { margin-bottom: 0; }
        .filter-label { display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold; color: var(--text-muted); margin-bottom: 0.5rem; }
        .filter-group input[type="text"], .filter-group input[type="number"], .filter-group select { width: 100%; padding: 0.5rem 0.75rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-btn); font-size: 0.88rem; font-family: inherit; color: var(--text-main); box-sizing: border-box; outline: none; }
        .filter-group input:focus, .filter-group select:focus { border-color: var(--primary); }
        .check-list { display: flex; flex-direction: column; gap: 0.4rem; }
        .check-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.88rem; color: var(--text-main); cursor: pointer; }
        .check-item input[type="checkbox"] { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }
        .salary-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .salary-row input { text-align: center; }
        .btn-clear-filters { width: 100%; background: none; border: 1.5px solid var(--border-color); color: var(--text-muted); padding: 0.5rem; border-radius: var(--radius-btn); font-size: 0.85rem; font-weight: bold; cursor: pointer; }
        .btn-clear-filters:hover { border-color: var(--primary); color: var(--primary); }
        .results-area { display: flex; flex-direction: column; gap: 1rem; }
        .results-header { display: flex; justify-content: space-between; align-items: center; padding: 0 0.25rem; }
        .results-count { font-size: 0.9rem; color: var(--text-muted); }
        .results-count strong { color: var(--text-main); }
        .sort-select { padding: 0.4rem 0.75rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-btn); font-size: 0.85rem; font-family: inherit; color: var(--text-main); outline: none; }
        .result-job-card { padding: 1.5rem; }
        .rjc-top { display: flex; gap: 1rem; align-items: flex-start; margin-bottom: 1rem; }
        .company-badge { width: 48px; height: 48px; border-radius: 10px; background: var(--primary); color: white; font-weight: bold; font-size: 1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .rjc-title-group { flex: 1; }
        .rjc-title { font-size: 1.1rem; font-weight: bold; color: var(--primary); margin-bottom: 0.15rem; }
        .rjc-title a { color: inherit; text-decoration: none; }
        .rjc-title a:hover { text-decoration: underline; }
        .rjc-company { font-size: 0.9rem; font-weight: bold; color: var(--text-muted); }
        .rjc-meta { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.6rem 0; }
        .meta-tag { font-size: 0.8rem; background: var(--bg-light-hover); padding: 0.25rem 0.65rem; border-radius: 20px; color: var(--text-muted); font-weight: bold; }
        .rjc-skills { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.75rem 0; }
        .rjc-actions { display: flex; gap: 0.75rem; align-items: center; padding-top: 1rem; border-top: 1px solid var(--border-light); }
        .result-employer-card { padding: 1.5rem; }
        .rec-top { display: flex; gap: 1rem; align-items: flex-start; margin-bottom: 0.75rem; }
        .employer-badge { width: 52px; height: 52px; border-radius: 12px; color: white; font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .employer-info { flex: 1; }
        .employer-name { font-size: 1.05rem; font-weight: bold; color: var(--text-main); }
        .employer-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.4rem; }
        .employer-desc { font-size: 0.88rem; color: var(--text-muted); line-height: 1.6; margin: 0.5rem 0 0.75rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .employer-actions { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; padding-top: 0.9rem; border-top: 1px solid var(--border-light); }
        .verified-tag { color: var(--success) !important; border-color: var(--success) !important; background: #e6ffe6 !important; }
        .results-empty { text-align: center; padding: 3rem 2rem; color: var(--text-muted); }
        .results-empty .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
        @media (max-width: 860px) { .search-body { grid-template-columns: 1fr; } .filter-sidebar { order: 2; } }
    </style>
</head>
<body>
    <header>
        <a href="c_dashboard.html" class="header-logo-link">
            <div class="itmp-logo-placeholder"><img src="../../assests/images/ITMP.png" style="max-width: 100px;"></div>
        </a>
        <div class="header-search" style="display:none;"></div>
        <div class="header-nav">
            <a href="c_dashboard.html">Dashboard</a>
            <a href="c_edit_profile.html">My Profile</a>
            <a href="c_applications.html">My Applications</a>
            <a href="c_settings.html">Settings</a>
            <a href="#" onclick="DataService.logout();return false;">Sign Out</a>
        </div>
    </header>

    <main class="search-main dashboard-main">
        <div class="search-wrapper">
            <a href="c_dashboard.html" class="back-link">← Back to Dashboard</a>

            <div class="search-hero">
                <h1 id="hero-title">Find your next opportunity</h1>
                <div class="mode-toggle">
                    <button class="mode-btn active" id="btn-mode-jobs"      onclick="setMode('jobs')">🔍 Find Jobs</button>
                    <button class="mode-btn"         id="btn-mode-employers" onclick="setMode('employers')">🏢 Find Employers</button>
                </div>
                <div class="search-input-row">
                    <input type="text" id="main-search" placeholder="Search by title, skill, company or location…" onkeydown="if(event.key==='Enter') runSearch()">
                    <button class="btn-search-main" onclick="runSearch()">Search</button>
                </div>
            </div>

            <div class="search-body">
                <aside class="filter-sidebar">
                    <!-- JOB FILTERS -->
                    <div class="filter-card card" id="job-filters">
                        <h3>🎛 Filters</h3>
                        <div class="filter-group">
                            <label class="filter-label">Location</label>
                            <input type="text" id="jf-location" placeholder="e.g. Sydney" oninput="runSearch()">
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">Work Mode</label>
                            <div class="check-list">
                                <label class="check-item"><input type="checkbox" value="Remote"  onchange="runSearch()"> Remote</label>
                                <label class="check-item"><input type="checkbox" value="Hybrid"  onchange="runSearch()"> Hybrid</label>
                                <label class="check-item"><input type="checkbox" value="On-site" onchange="runSearch()"> On-site</label>
                            </div>
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">Salary Range (AUD)</label>
                            <div class="salary-row">
                                <input type="number" id="jf-sal-min" placeholder="Min" step="5000" oninput="runSearch()">
                                <input type="number" id="jf-sal-max" placeholder="Max" step="5000" oninput="runSearch()">
                            </div>
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">Job Type</label>
                            <div class="check-list">
                                <label class="check-item"><input type="checkbox" value="Full-time" onchange="runSearch()"> Full-time</label>
                                <label class="check-item"><input type="checkbox" value="Part-time" onchange="runSearch()"> Part-time</label>
                                <label class="check-item"><input type="checkbox" value="Contract"  onchange="runSearch()"> Contract</label>
                            </div>
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">Industry</label>
                            <select id="jf-industry" onchange="runSearch()">
                                <option value="">All Industries</option>
                                <option>Software / SaaS</option><option>Data & Analytics</option>
                                <option>Cloud Infrastructure</option><option>Fintech / Data</option>
                                <option>Digital Agency</option><option>Healthcare</option><option>E-commerce</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">Minimum Match Score</label>
                            <select id="jf-match" onchange="runSearch()">
                                <option value="">Any</option><option value="50">50%+</option>
                                <option value="70">70%+</option><option value="80">80%+</option><option value="90">90%+</option>
                            </select>
                        </div>
                        <button class="btn-clear-filters" onclick="clearFilters()">Clear all filters</button>
                    </div>

                    <!-- EMPLOYER FILTERS -->
                    <div class="filter-card card" id="employer-filters" style="display:none;">
                        <h3>🎛 Filters</h3>
                        <div class="filter-group">
                            <label class="filter-label">Location</label>
                            <input type="text" id="ef-location" placeholder="e.g. Sydney" oninput="runSearch()">
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">Industry</label>
                            <select id="ef-industry" onchange="runSearch()">
                                <option value="">All Industries</option>
                                <option>Technology & Software</option><option>Healthcare & Medical</option>
                                <option>Finance & Accounting</option><option>Education & Training</option>
                                <option>Data & Analytics</option><option>Other</option>
                            </select>
                        </div>
                        <button class="btn-clear-filters" onclick="clearFilters()">Clear all filters</button>
                    </div>
                </aside>

                <div class="results-area">
                    <div class="results-header">
                        <div class="results-count" id="results-count">Showing <strong>0</strong> results</div>
                        <select class="sort-select" id="sort-select" onchange="runSearch()">
                            <option value="match">Best Match</option>
                            <option value="salary_desc">Salary: High to Low</option>
                            <option value="salary_asc">Salary: Low to High</option>
                            <option value="newest">Newest First</option>
                            <option value="applicants">Fewest Applicants</option>
                        </select>
                    </div>
                    <div id="results-list"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="minimal-footer">
        <div class="footer-links"><a href="#">Terms of Service</a><a href="#">Privacy Policy</a></div>
        <div class="footer-copyright">&copy; 2026 ITMP. All rights reserved.</div>
    </footer>

    <script src="../../assests/js/data.js"></script>
    <script>
        let _mode = 'jobs';

        function setMode(mode) {
            _mode = mode;
            document.getElementById('btn-mode-jobs').classList.toggle('active',      mode === 'jobs');
            document.getElementById('btn-mode-employers').classList.toggle('active', mode === 'employers');
            document.getElementById('job-filters').style.display      = mode === 'jobs'      ? '' : 'none';
            document.getElementById('employer-filters').style.display = mode === 'employers' ? '' : 'none';
            document.getElementById('sort-select').style.display      = mode === 'jobs'      ? '' : 'none';
            document.getElementById('hero-title').textContent = mode === 'jobs' ? 'Find your next opportunity' : 'Browse employers';
            document.getElementById('main-search').placeholder = mode === 'jobs'
                ? 'Search by title, skill, company or location…'
                : 'Search by company name, industry or location…';
            runSearch();
        }

        function getJobFilters() {
            const lists = [...document.querySelectorAll('#job-filters .check-list')];
            return {
                query:     document.getElementById('main-search').value,
                location:  document.getElementById('jf-location').value,
                workMode:  lists[0] ? [...lists[0].querySelectorAll('input:checked')].map(c => c.value) : [],
                jobType:   lists[1] ? [...lists[1].querySelectorAll('input:checked')].map(c => c.value) : [],
                industry:  document.getElementById('jf-industry').value,
                salaryMin: +document.getElementById('jf-sal-min').value || null,
                salaryMax: +document.getElementById('jf-sal-max').value || null,
                matchMin:  +document.getElementById('jf-match').value   || null,
            };
        }

        function getEmployerFilters() {
            return {
                query:    document.getElementById('main-search').value,
                location: document.getElementById('ef-location').value,
                industry: document.getElementById('ef-industry').value,
            };
        }

        function sortJobs(jobs) {
            const sort = document.getElementById('sort-select').value;
            return [...jobs].sort((a, b) => {
                if (sort === 'salary_desc') return b.salary_max - a.salary_max;
                if (sort === 'salary_asc')  return a.salary_min - b.salary_min;
                if (sort === 'newest')      return new Date(b.posted_date) - new Date(a.posted_date);
                if (sort === 'applicants')  return a.applications_count - b.applications_count;
                return b.match_score - a.match_score;
            });
        }

        function runSearch() {
            DataService.onReady(() => {
                if (_mode === 'jobs') renderJobResults();
                else                  renderEmployerResults();
            });
        }

        function renderJobResults() {
            const filters = getJobFilters();
            const jobs    = sortJobs(DataService.searchJobs(filters));
            const list    = document.getElementById('results-list');
            const user    = DataService.getCurrentUser();
            document.getElementById('results-count').innerHTML = `Showing <strong>${jobs.length}</strong> job${jobs.length !== 1 ? 's' : ''}`;
            if (!jobs.length) { list.innerHTML = `<div class="results-empty"><div class="empty-icon">🔍</div><p>No jobs match your search.</p></div>`; return; }
            const userSkills = (user?.skills ?? []).map(s => s.toLowerCase());
            list.innerHTML = jobs.map(job => {
                const skillChips = job.skills.map(s =>
                    `<span class="skill-tag ${userSkills.includes(s.name.toLowerCase()) ? 'match' : ''}">${s.name}</span>`
                ).join('');
                const actionBtn = job.isApplied
                    ? `<button class="btn-applied" disabled>✔ Applied</button>`
                    : `<button class="btn-primary btn-sm" onclick="doApply('${job.id}')">One-Click Apply</button>`;
                const saveBtn = job.isSaved
                    ? `<button class="btn-text" onclick="doSave('${job.id}')" style="color:var(--primary);">★ Saved</button>`
                    : `<button class="btn-text" onclick="doSave('${job.id}')">☆ Save</button>`;
                const empLink = job.employer_id
                    ? `<a href="c_view_employer.html?id=${job.employer_id}" class="btn-text">${job.company}</a>`
                    : '';
                return `
                <div class="card result-job-card">
                    <div class="rjc-top">
                        <div class="company-badge">${job.company_initials}</div>
                        <div class="rjc-title-group">
                            <div class="rjc-title"><a href="c_view_job.html?id=${job.id}">${job.title}</a></div>
                            <div class="rjc-company">${empLink}</div>
                            <div class="rjc-meta">
                                <span class="meta-tag">📍 ${job.location}</span>
                                <span class="meta-tag">🖥️ ${job.work_mode}</span>
                                <span class="meta-tag">💰 ${job.salary_display}</span>
                                <span class="meta-tag">💼 ${job.job_type}</span>
                            </div>
                        </div>
                        <div class="match-score">${job.match_score}% Match</div>
                    </div>
                    <div class="rjc-skills">${skillChips}</div>
                    <div class="rjc-actions">
                        ${actionBtn}${saveBtn}
                        <a href="c_view_job.html?id=${job.id}" class="btn-text" style="margin-left:auto;">View details →</a>
                    </div>
                </div>`;
            }).join('');
        }

        function renderEmployerResults() {
            const filters   = getEmployerFilters();
            const employers = DataService.searchEmployers ? DataService.searchEmployers(filters) : [];
            const list      = document.getElementById('results-list');
            document.getElementById('results-count').innerHTML = `Showing <strong>${employers.length}</strong> employer${employers.length !== 1 ? 's' : ''}`;
            if (!employers.length) { list.innerHTML = `<div class="results-empty"><div class="empty-icon">🏢</div><p>No employers match your search.</p></div>`; return; }
            const allJobs = DataService.getAllJobs ? DataService.getAllJobs() : [];
            list.innerHTML = employers.map(e => {
                const jobCount = allJobs.filter(j => j.employer_id === e.id).length;
                const snippet  = e.description ? e.description.slice(0, 160) + (e.description.length > 160 ? '…' : '') : '';
                const websiteBtn = e.website
                    ? `<a href="${/^https?:\/\//i.test(e.website) ? e.website : 'https://' + e.website}" target="_blank" rel="noopener" class="btn-secondary btn-sm" style="text-decoration:none;">🌐 Website</a>`
                    : '';
                return `
                <div class="card result-employer-card">
                    <div class="rec-top">
                        <div class="employer-badge" style="background:${e.avatar_color}">${e.avatar_initials}</div>
                        <div class="employer-info">
                            <div class="employer-name">${e.company_name}</div>
                            <div class="employer-meta">
                                ${e.industry ? `<span class="meta-tag">🏭 ${e.industry}</span>` : ''}
                                ${e.location ? `<span class="meta-tag">📍 ${e.location}</span>` : ''}
                                ${e.is_verified ? `<span class="meta-tag verified-tag">✔ Verified</span>` : ''}
                                ${jobCount > 0 ? `<span class="meta-tag">💼 ${jobCount} open position${jobCount !== 1 ? 's' : ''}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    ${snippet ? `<p class="employer-desc">${snippet}</p>` : ''}
                    <div class="employer-actions">
                        <a href="c_view_employer.html?id=${e.id}" class="btn-primary btn-sm" style="text-decoration:none;">View Profile</a>
                        ${websiteBtn}
                        <a href="c_search_result.html?mode=jobs&q=${encodeURIComponent(e.company_name)}" class="btn-text" style="margin-left:auto;">Browse Jobs →</a>
                    </div>
                </div>`;
            }).join('');
        }

        function doApply(jobId) { DataService.applyForJob(jobId); runSearch(); }
        function doSave(jobId)  { DataService.toggleSaveJob(jobId); runSearch(); }

        function clearFilters() {
            document.querySelectorAll('.filter-card input[type=text]').forEach(i => i.value = '');
            document.querySelectorAll('.filter-card input[type=number]').forEach(i => i.value = '');
            document.querySelectorAll('.filter-card input[type=checkbox]').forEach(i => i.checked = false);
            document.querySelectorAll('.filter-card select').forEach(s => s.selectedIndex = 0);
            runSearch();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('q')) document.getElementById('main-search').value = params.get('q');
            const mode = params.get('mode') === 'employers' ? 'employers' : 'jobs';
            DataService.onReady(() => setMode(mode));
        });
    </script>
</body>
</html>
