<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Profile – ITMP</title>
    <link rel="stylesheet" href="../../assests/styling/global.css">
    <link rel="stylesheet" href="../../assests/styling/dashboard.css">
    <style>
        .profile-detail-main { padding: 2rem; flex-direction: column; align-items: center; justify-content: flex-start; }
        .profile-detail-container { width: 100%; max-width: 1100px; display: grid; grid-template-columns: 1fr 340px; gap: 2rem; align-items: start; }
        .back-link { display: block; color: var(--primary); font-weight: bold; font-size: 0.9rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { text-decoration: underline; }
        .pd-left-col  { display: flex; flex-direction: column; gap: 1.5rem; }
        .pd-right-col { display: flex; flex-direction: column; gap: 1.5rem; }
        .pd-hero-card { padding: 2rem; }
        .pd-hero-top { display: flex; gap: 1.25rem; align-items: flex-start; margin-bottom: 1.5rem; }
        .pd-avatar { width: 80px; height: 80px; border-radius: 50%; background-color: var(--primary); color: white; font-weight: bold; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .pd-title-group { flex: 1; }
        .pd-title-group h1 { font-size: 1.6rem; color: var(--text-main); margin-bottom: 0.2rem; text-align: left; }
        .pd-headline { font-size: 1rem; font-weight: bold; color: var(--primary); margin-bottom: 0.6rem; }
        .pd-badges { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .meta-badge { display: inline-flex; align-items: center; gap: 0.3rem; background-color: var(--bg-light-hover); color: var(--text-muted); padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.82rem; font-weight: bold; }
        .match-score-large { background-color: #e6ffe6; color: var(--success); font-weight: bold; padding: 0.6rem 1.25rem; border-radius: 24px; font-size: 1rem; border: 1.5px solid var(--success); white-space: nowrap; align-self: flex-start; }
        .open-to-work-badge { display: inline-flex; align-items: center; gap: 0.4rem; background: #e6ffe6; color: var(--success); border: 1px solid var(--success); padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .open-to-work-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; display: inline-block; }
        .pd-hero-actions { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; padding-top: 1.5rem; border-top: 1px solid var(--border-light); }
        .pd-section-card { padding: 1.75rem; }
        .pd-section-card h2 { font-size: 1rem; color: var(--text-main); margin-bottom: 1.25rem; padding-bottom: 0.6rem; border-bottom: 2px solid var(--border-light); }
        .pd-bio { font-size: 0.95rem; color: var(--text-muted); line-height: 1.75; }
        .experience-list { display: flex; flex-direction: column; gap: 1.5rem; }
        .experience-item { display: grid; grid-template-columns: 4px 1fr; gap: 0 1.25rem; }
        .experience-line { background-color: var(--primary); border-radius: 4px; opacity: 0.25; }
        .exp-title { font-weight: bold; color: var(--text-main); font-size: 1rem; }
        .exp-company { color: var(--primary); font-weight: bold; font-size: 0.9rem; }
        .exp-period { font-size: 0.82rem; color: var(--text-muted); margin: 0.25rem 0 0.5rem; }
        .exp-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }
        .education-item { display: flex; gap: 1rem; align-items: flex-start; margin-bottom: 1.25rem; }
        .education-item:last-child { margin-bottom: 0; }
        .edu-icon { width: 42px; height: 42px; background: var(--bg-light-hover); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; flex-shrink: 0; }
        .edu-degree { font-weight: bold; color: var(--text-main); }
        .edu-institution { color: var(--primary); font-size: 0.9rem; font-weight: bold; }
        .edu-meta { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.2rem; }
        .skills-match-grid { display: flex; flex-wrap: wrap; gap: 0.6rem; }
        .skill-chip { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.9rem; border-radius: 20px; font-size: 0.85rem; font-weight: bold; border: 1.5px solid; }
        .skill-chip.matched   { background-color: #e6ffe6; color: var(--success); border-color: var(--success); }
        .skill-chip.unmatched { background-color: var(--bg-light-hover); color: var(--text-muted); border-color: var(--border-color); }
        .action-card { padding: 1.75rem; background: linear-gradient(135deg, #f0f7ff 0%, #e8f4ff 100%); border: 1.5px solid var(--primary-light); }
        .action-card h3 { font-size: 1rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .action-avail { font-size: 1.4rem; font-weight: bold; color: var(--primary); margin-bottom: 1.25rem; }
        .action-card .btn-primary { width: 100%; margin-bottom: 0.75rem; font-size: 1rem; padding: 0.85rem; }
        .action-card .btn-secondary { width: 100%; font-size: 0.9rem; }
        .action-card-meta { margin-top: 1.25rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .action-meta-row { display: flex; justify-content: space-between; font-size: 0.82rem; }
        .action-meta-row .label { color: var(--text-muted); }
        .action-meta-row .value { font-weight: bold; color: var(--text-main); }
        .contact-card { padding: 1.75rem; }
        .contact-card h3 { font-size: 1rem; margin-bottom: 1rem; color: var(--text-main); }
        .contact-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.55rem 0; border-bottom: 1px solid var(--border-light); }
        .contact-row:last-child { border-bottom: none; }
        .contact-row .c-label { color: var(--text-muted); }
        .contact-row .c-value, .contact-row .c-value a { font-weight: bold; color: var(--primary); text-decoration: none; }
        .contact-locked { color: var(--text-muted); font-style: italic; font-size: 0.85rem; }
        .invited-banner { display: none; background-color: #e6ffe6; border: 1.5px solid var(--success); border-radius: var(--radius-card); padding: 1rem 1.25rem; color: var(--success); font-weight: bold; text-align: center; margin-bottom: 0.75rem; }
        .invited-banner.show { display: block; }
        .not-found { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
        @media (max-width: 860px) { .profile-detail-container { grid-template-columns: 1fr; } .pd-right-col { order: -1; } }
    </style>
</head>
<body>
    <header>
        <a href="e_dashboard.html" class="header-logo-link">
            <div class="itmp-logo-placeholder"><img src="../../assests/images/ITMP.png" style="max-width: 100px;"></div>
        </a>
        <div class="header-search">
            <input type="text" placeholder="Search for candidates..." class="quick-search-input" id="header-search">
            <button class="btn-search-small"
                onclick="window.location.href='e_search_result.html?q='+encodeURIComponent(document.getElementById('header-search').value)">Search</button>
        </div>
        <div class="header-nav">
            <a href="e_dashboard.html">Dashboard</a>
            <a href="e_search_result.html">Browse Candidates</a>
            <a href="e_settings.html">Settings</a>
            <a href="#" onclick="DataService.logout();return false;">Sign Out</a>
        </div>
    </header>

    <main class="profile-detail-main dashboard-main">
        <div style="width:100%;max-width:1100px;margin:0 auto;">
            <a href="e_dashboard.html" class="back-link">← Back to Dashboard</a>
        </div>
        <div class="profile-detail-container" id="profile-detail-root"></div>
        <div class="not-found" id="not-found" style="display:none;">
            <h2>Candidate Not Found</h2>
            <p>This profile may have been removed or is no longer available.</p>
            <a href="e_dashboard.html" class="btn-primary" style="display:inline-block;margin-top:1rem;">Back to Dashboard</a>
        </div>
    </main>

    <footer class="minimal-footer">
        <div class="footer-links"><a href="#">Terms of Service</a><a href="#">Privacy Policy</a><a href="#">Employer Terms</a></div>
        <div class="footer-copyright">&copy; 2026 ITMP. All rights reserved.</div>
    </footer>

    <script src="../../assests/js/data.js"></script>
    <script>
        const sessionSaved = new Set();

        function getIdFromURL() { return new URLSearchParams(window.location.search).get('id'); }
        function candidateId(c) { return c.id != null ? c.id : (c.full_name||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
        function fmtDate(isoMonth) {
            if (!isoMonth) return '';
            const [y, m] = String(isoMonth).split('-');
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return m ? `${months[parseInt(m)-1]} ${y}` : y;
        }
        function resolveCandidate(id) {
            if (DataService.getCandidateById) { const c = DataService.getCandidateById(id); if (c) return c; }
            const all = (DataService.searchCandidates && DataService.searchCandidates({})) || [];
            return all.find(c => String(candidateId(c)) === String(id)) || null;
        }
        function employerSkills() {
            const emp = DataService.getCurrentEmployer && DataService.getCurrentEmployer();
            return ((emp && emp.target_skills) || []).map(s => String(s).toLowerCase());
        }

        function renderProfilePage() {
            DataService.onReady(() => {
                const id   = getIdFromURL();
                const c    = resolveCandidate(id);
                const root = document.getElementById('profile-detail-root');

                if (!c) {
                    root.style.display = 'none';
                    document.getElementById('not-found').style.display = 'block';
                    return;
                }

                document.title = `${c.full_name} – ITMP`;

                const empSkills = employerSkills();
                const cSkills   = (c.skills || []);
                const skillChipsHtml = cSkills.map(s => {
                    const isMatch = empSkills.includes(String(s).toLowerCase());
                    return `<span class="skill-chip ${isMatch ? 'matched' : 'unmatched'}">${isMatch ? '✔' : '○'} ${s}</span>`;
                }).join('');

                let matchScore = c.match_score;
                if (matchScore == null && empSkills.length) {
                    const hits = cSkills.filter(s => empSkills.includes(String(s).toLowerCase())).length;
                    matchScore = Math.round((hits / empSkills.length) * 100);
                }

                const experienceHtml = (c.experience || []).map(exp => `
                    <div class="experience-item">
                        <div class="experience-line"></div>
                        <div>
                            <div class="exp-title">${exp.title}</div>
                            <div class="exp-company">${exp.company}${exp.location ? ' &bull; ' + exp.location : ''}</div>
                            <div class="exp-period">${fmtDate(exp.start_date)} – ${exp.current ? 'Present' : fmtDate(exp.end_date)}</div>
                            ${exp.description ? `<div class="exp-desc">${exp.description}</div>` : ''}
                        </div>
                    </div>`).join('');

                const educationHtml = (c.education || []).map(edu => `
                    <div class="education-item">
                        <div class="edu-icon">🎓</div>
                        <div>
                            <div class="edu-degree">${edu.degree}</div>
                            <div class="edu-institution">${edu.institution}</div>
                            <div class="edu-meta">${[edu.major, (edu.start_year && edu.end_year) ? edu.start_year+'–'+edu.end_year : '', edu.gpa].filter(Boolean).join(' &bull; ')}</div>
                        </div>
                    </div>`).join('');

                const id2     = candidateId(c);
                const isSaved = sessionSaved.has(String(id2));
                const openBadge = c.open_to_work ? `<span class="open-to-work-badge"><span class="open-to-work-dot"></span>Open to Work</span>` : '';
                const contactVisible = c.contact && (c.contact_visible !== false);
                const contactHtml = contactVisible ? `
                    ${c.contact.email    ? `<div class="contact-row"><span class="c-label">Email</span><span class="c-value"><a href="mailto:${c.contact.email}">${c.contact.email}</a></span></div>` : ''}
                    ${c.contact.phone    ? `<div class="contact-row"><span class="c-label">Phone</span><span class="c-value">${c.contact.phone}</span></div>` : ''}
                    ${c.contact.linkedin ? `<div class="contact-row"><span class="c-label">LinkedIn</span><span class="c-value"><a href="https://${c.contact.linkedin}" target="_blank">View</a></span></div>` : ''}
                    ${c.contact.github   ? `<div class="contact-row"><span class="c-label">GitHub</span><span class="c-value"><a href="https://${c.contact.github}" target="_blank">View</a></span></div>` : ''}
                ` : `<p class="contact-locked">Contact details unlock once the candidate accepts your invitation to apply.</p>`;

                root.innerHTML = `
                    <div class="pd-left-col">
                        <div class="card pd-hero-card">
                            <div class="pd-hero-top">
                                <div class="pd-avatar" style="background:${c.avatar_color || 'var(--primary)'}">${c.avatar_initials || ''}</div>
                                <div class="pd-title-group">
                                    <h1>${c.full_name}</h1>
                                    <div class="pd-headline">${c.headline || ''}</div>
                                    <div class="pd-badges">
                                        <span class="meta-badge">📍 ${c.location || '—'}</span>
                                        <span class="meta-badge">🖥️ ${c.work_mode_preference || '—'}</span>
                                        <span class="meta-badge">💼 ${c.yoe ?? '—'} yrs experience</span>
                                        ${c.availability ? `<span class="meta-badge">⏱ ${c.availability}</span>` : ''}
                                        ${openBadge}
                                    </div>
                                </div>
                                ${matchScore != null ? `<div class="match-score-large">${matchScore}% Match</div>` : ''}
                            </div>
                            <div class="pd-hero-actions">
                                <button class="btn-primary btn-sm" onclick="handleInvite('${id2}')">Invite to Apply</button>
                                <button class="btn-secondary btn-sm" id="save-btn" onclick="handleSave('${id2}')">${isSaved ? '★ Saved' : '☆ Save Candidate'}</button>
                                <span style="color:var(--text-muted);font-size:0.85rem;margin-left:auto;">${c.profile_views != null ? `👁 ${c.profile_views} profile views` : ''}</span>
                            </div>
                        </div>

                        ${c.bio ? `<div class="card pd-section-card"><h2>About</h2><p class="pd-bio">${c.bio}</p></div>` : ''}
                        ${experienceHtml ? `<div class="card pd-section-card"><h2>Experience</h2><div class="experience-list">${experienceHtml}</div></div>` : ''}
                        ${educationHtml  ? `<div class="card pd-section-card"><h2>Education</h2>${educationHtml}</div>` : ''}

                        <div class="card pd-section-card">
                            <h2>Skills</h2>
                            ${empSkills.length ? `<div style="font-size:0.82rem;color:var(--text-muted);margin-bottom:1rem;"><span style="color:var(--success);font-weight:bold;">✔ Matches your target skills</span> &nbsp; <span style="color:var(--text-muted);font-weight:bold;">○ Additional skill</span></div>` : ''}
                            <div class="skills-match-grid">${skillChipsHtml || '<span class="contact-locked">No skills listed.</span>'}</div>
                        </div>
                    </div>

                    <div class="pd-right-col">
                        <div class="card action-card">
                            <div class="invited-banner" id="invited-banner">✔ Invitation sent</div>
                            <h3>Availability</h3>
                            <div class="action-avail">${c.availability || 'Not specified'}</div>
                            <button class="btn-primary" onclick="handleInvite('${id2}')">Invite to Apply</button>
                            <button class="btn-secondary" id="save-btn-sidebar" onclick="handleSave('${id2}')">${isSaved ? '★ Saved' : '☆ Save Candidate'}</button>
                            <div class="action-card-meta">
                                <div class="action-meta-row"><span class="label">Experience</span><span class="value">${c.yoe ?? '—'} yrs</span></div>
                                <div class="action-meta-row"><span class="label">Work Mode</span><span class="value">${c.work_mode_preference || '—'}</span></div>
                                <div class="action-meta-row"><span class="label">Location</span><span class="value">${c.location || '—'}</span></div>
                                ${c.open_to_work ? `<div class="action-meta-row"><span class="label">Status</span><span class="value" style="color:var(--success);">Open to work</span></div>` : ''}
                            </div>
                        </div>
                        <div class="card contact-card"><h3>Contact</h3>${contactHtml}</div>
                        ${c.resume_path ? `<div class="card contact-card"><h3>📄 Resume</h3><div class="contact-row"><span class="c-label">CV / Resume</span><span class="c-value"><a href="${c.resume_path}" target="_blank" rel="noopener">View Resume</a></span></div></div>` : ''}
                    </div>
                `;
            });
        }

        function handleSave(id) {
            const key = String(id);
            if (sessionSaved.has(key)) sessionSaved.delete(key); else sessionSaved.add(key);
            if (DataService.toggleSaveCandidate) DataService.toggleSaveCandidate(id);
            const label = sessionSaved.has(key) ? '★ Saved' : '☆ Save Candidate';
            const a = document.getElementById('save-btn');
            const b = document.getElementById('save-btn-sidebar');
            if (a) a.textContent = label;
            if (b) b.textContent = label;
        }
        function handleInvite(id) {
            if (DataService.inviteCandidate) DataService.inviteCandidate(id);
            const banner = document.getElementById('invited-banner');
            if (banner) banner.classList.add('show');
        }

        document.addEventListener('DOMContentLoaded', renderProfilePage);
    </script>
</body>
</html>
