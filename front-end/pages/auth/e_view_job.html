<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Listing – ITMP</title>
    <link rel="stylesheet" href="../../assests/styling/global.css">
    <link rel="stylesheet" href="../../assests/styling/dashboard.css">
    <link rel="icon" type="image/x-icon" href="../../assests/images/ITMP-icon-logo.ico">
    <style>
        .job-detail-main { padding: 2rem; flex-direction: column; align-items: center; justify-content: flex-start; }
        .job-detail-container { width: 100%; max-width: 1100px; display: grid; grid-template-columns: 1fr 340px; gap: 2rem; align-items: start; }
        .back-link { display: block; color: var(--primary); font-weight: bold; font-size: 0.9rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { text-decoration: underline; }
        .job-left-col  { display: flex; flex-direction: column; gap: 1.5rem; }
        .job-right-col { display: flex; flex-direction: column; gap: 1.5rem; }
        .job-hero-card { padding: 2rem; }
        .job-hero-top { display: flex; gap: 1.25rem; align-items: flex-start; margin-bottom: 1.5rem; }
        .company-logo-large { width: 68px; height: 68px; border-radius: 14px; background-color: var(--primary); color: white; font-weight: bold; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .job-hero-title-group { flex: 1; }
        .job-hero-title-group h1 { font-size: 1.6rem; color: var(--text-main); margin-bottom: 0.2rem; text-align: left; }
        .job-hero-company { font-size: 1rem; font-weight: bold; color: var(--primary); margin-bottom: 0.6rem; }
        .job-hero-badges { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .meta-badge { display: inline-flex; align-items: center; gap: 0.3rem; background-color: var(--bg-light-hover); color: var(--text-muted); padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.82rem; font-weight: bold; }
        .status-pill { padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.82rem; font-weight: bold; }
        .status-open   { background: #e6ffe6; color: var(--success); border: 1px solid var(--success); }
        .status-closed { background: #f0f0f0; color: #555; border: 1px solid #ccc; }
        .job-hero-actions { display: flex; gap: 1rem; align-items: center; padding-top: 1.5rem; border-top: 1px solid var(--border-light); flex-wrap: wrap; }
        .job-section-card { padding: 1.75rem; }
        .job-section-card h2 { font-size: 1rem; color: var(--text-main); margin-bottom: 1.25rem; padding-bottom: 0.6rem; border-bottom: 2px solid var(--border-light); }
        .job-full-desc { font-size: 0.95rem; color: var(--text-muted); line-height: 1.75; }
        .job-bullet-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.6rem; }
        .job-bullet-list li { display: flex; gap: 0.65rem; font-size: 0.93rem; color: var(--text-muted); line-height: 1.5; }
        .job-bullet-list li::before { content: '✦'; color: var(--primary); font-size: 0.7rem; margin-top: 0.3rem; flex-shrink: 0; }
        /* Applicants */
        .applicant-row { display: flex; align-items: center; gap: 1rem; padding: 0.85rem 0; border-bottom: 1px solid var(--border-light); }
        .applicant-row:last-child { border-bottom: none; }
        .applicant-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1rem; color: white; flex-shrink: 0; }
        .applicant-info { flex: 1; min-width: 0; }
        .applicant-name { font-weight: bold; color: var(--text-main); font-size: 0.95rem; }
        .applicant-meta { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.15rem; }
        .applicant-date { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }
        /* Stat card */
        .stat-card { padding: 1.75rem; background: linear-gradient(135deg, #f0f7ff 0%, #e8f4ff 100%); border: 1.5px solid var(--primary-light); }
        .stat-card h3 { font-size: 1rem; margin-bottom: 1.25rem; color: var(--text-main); }
        .stat-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border-light); }
        .stat-row:last-child { border-bottom: none; }
        .stat-row .s-label { color: var(--text-muted); }
        .stat-row .s-value { font-weight: bold; color: var(--text-main); }
        .stat-big { font-size: 2rem; font-weight: bold; color: var(--primary); text-align: center; padding: 1rem 0; }
        .stat-big-label { font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-bottom: 1rem; }
        .not-found { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
        @media (max-width: 860px) { .job-detail-container { grid-template-columns: 1fr; } .job-right-col { order: -1; } }
    </style>
</head>
<body>
    <header>
        <a href="e_dashboard.html" class="header-logo-link">
            <div class="itmp-logo-placeholder"><img src="../../assests/images/ITMP.png" style="max-width: 100px;"></div>
        </a>
        <div class="header-search">
            <input type="text" placeholder="Search for candidates..." class="quick-search-input" id="header-search">
            <button class="btn-search-small"
                onclick="window.location.href='e_search_result.html?q='+encodeURIComponent(document.getElementById('header-search').value)">Search</button>
        </div>
        <div class="header-nav">
            <a href="e_dashboard.html">Dashboard</a>
            <a href="e_search_result.html">Browse Candidates</a>
            <a href="e_my_jobs.html">My Jobs</a>
            <a href="#" onclick="DataService.logout();return false;">Sign Out</a>
        </div>
    </header>

    <main class="job-detail-main dashboard-main">
        <div style="width:100%;max-width:1100px;margin:0 auto;">
            <a href="e_my_jobs.html" class="back-link">← Back to My Jobs</a>
        </div>
        <div class="job-detail-container" id="job-detail-root"></div>
        <div class="not-found" id="not-found" style="display:none;">
            <h2>Job Not Found</h2>
            <p>This listing may have been removed.</p>
            <a href="e_dashboard.html" class="btn-primary" style="display:inline-block;margin-top:1rem;">Back to Dashboard</a>
        </div>
    </main>

    <footer class="minimal-footer">
        <div class="footer-links"><a href="#">Terms of Service</a><a href="#">Privacy Policy</a><a href="#">Employer Terms</a></div>
        <div class="footer-copyright">&copy; 2026 ITMP. All rights reserved.</div>
    </footer>

    <script src="../../assests/js/data.js"></script>
    <script>
        function getJobIdFromURL() { return new URLSearchParams(window.location.search).get('id'); }

        function renderJobPage() {
            DataService.onReady(() => {
                const jobId = getJobIdFromURL();
                const job   = DataService.getJobById(jobId);
                const root  = document.getElementById('job-detail-root');

                if (!job) {
                    root.style.display = 'none';
                    document.getElementById('not-found').style.display = 'block';
                    return;
                }

                document.title = `${job.title} – ITMP`;

                const posted    = DataService.timeAgo(job.posted_date);
                const status    = job.status || 'Open';
                const statusCls = /clos/i.test(status) ? 'status-closed' : 'status-open';

                const responsibilitiesHtml = (job.responsibilities || []).map(r => `<li>${r}</li>`).join('');
                const requirementsHtml     = (job.requirements     || []).map(r => `<li>${r}</li>`).join('');
                const benefitsHtml         = (job.benefits         || []).map(b => `<li>${b}</li>`).join('');

                root.innerHTML = `
                    <div class="job-left-col">
                        <div class="card job-hero-card">
                            <div class="job-hero-top">
                                <div class="company-logo-large">${job.company_initials}</div>
                                <div class="job-hero-title-group">
                                    <h1>${job.title}</h1>
                                    <div class="job-hero-company">${job.company}</div>
                                    <div class="job-hero-badges">
                                        <span class="meta-badge">📍 ${job.location}</span>
                                        <span class="meta-badge">🖥️ ${job.work_mode}</span>
                                        <span class="meta-badge">💼 ${job.job_type}</span>
                                        <span class="meta-badge">🏢 ${job.industry}</span>
                                        <span class="meta-badge">📅 Posted ${posted}</span>
                                        <span class="meta-badge">👥 ${job.applications_count} applicants</span>
                                    </div>
                                </div>
                                <span class="status-pill ${statusCls}">${status}</span>
                            </div>
                            <div class="job-hero-actions">
                                <a href="e_create_job.html" class="btn-secondary btn-sm" style="text-decoration:none;">+ Post New Job</a>
                                <a href="e_search_result.html" class="btn-primary btn-sm" style="text-decoration:none;">Find Candidates</a>
                                <span style="color:var(--text-muted);font-size:0.85rem;margin-left:auto;">Expires ${job.expires_date}</span>
                            </div>
                        </div>

                        <div class="card job-section-card"><h2>About the Role</h2><p class="job-full-desc">${job.full_description}</p></div>
                        <div class="card job-section-card"><h2>Key Responsibilities</h2><ul class="job-bullet-list">${responsibilitiesHtml}</ul></div>
                        <div class="card job-section-card"><h2>Requirements</h2><ul class="job-bullet-list">${requirementsHtml}</ul></div>
                        <div class="card job-section-card"><h2>Benefits &amp; Perks</h2><ul class="job-bullet-list">${benefitsHtml}</ul></div>

                        <!-- Applicants -->
                        <div class="card job-section-card" id="applicants-section">
                            <h2>Applicants</h2>
                            <div id="applicants-body"><p style="color:var(--text-muted);font-size:0.9rem;">Loading…</p></div>
                        </div>
                    </div>

                    <div class="job-right-col">
                        <div class="card stat-card">
                            <h3>Listing Overview</h3>
                            <div class="stat-big">${job.applications_count}</div>
                            <div class="stat-big-label">total applicants</div>
                            <div class="stat-row"><span class="s-label">Salary</span><span class="s-value">${job.salary_display}</span></div>
                            <div class="stat-row"><span class="s-label">Job Type</span><span class="s-value">${job.job_type}</span></div>
                            <div class="stat-row"><span class="s-label">Work Mode</span><span class="s-value">${job.work_mode}</span></div>
                            <div class="stat-row"><span class="s-label">Location</span><span class="s-value">${job.location}</span></div>
                            <div class="stat-row"><span class="s-label">Status</span><span class="s-value">${status}</span></div>
                            <div class="stat-row"><span class="s-label">Closes</span><span class="s-value">${job.expires_date || '—'}</span></div>
                        </div>

                        <div style="display:flex;flex-direction:column;gap:0.75rem;">
                            <a href="e_search_result.html" class="btn-primary" style="display:block;text-align:center;text-decoration:none;padding:0.85rem;border-radius:var(--radius-btn);">🔍 Find Matching Candidates</a>
                            <a href="e_create_job.html" class="btn-secondary" style="display:block;text-align:center;text-decoration:none;padding:0.75rem;border-radius:var(--radius-btn);">+ Post Another Job</a>
                        </div>
                    </div>
                `;

                loadApplicants(jobId);
            });
        }

        function loadApplicants(jobId) {
            const user = DataService.getCurrentUser();
            if (!user) return;

            const API = `http://localhost:3000/api/jobs/${jobId}/applicants`;
            fetch(API, { headers: { 'X-User-Id': String(user.id) } })
                .then(r => r.ok ? r.json() : Promise.reject(r.status))
                .then(applicants => {
                    const body = document.getElementById('applicants-body');
                    if (!body) return;
                    if (!applicants.length) {
                        body.innerHTML = '<p style="color:var(--text-muted);font-size:0.9rem;">No one has applied yet.</p>';
                        return;
                    }
                    body.innerHTML = applicants.map(a => {
                        const date = a.applied_at ? new Date(a.applied_at).toLocaleDateString() : '';
                        return `
                        <div class="applicant-row">
                            <div class="applicant-avatar" style="background:${a.avatar_color || 'var(--primary)'}">
                                ${a.avatar_initials || '?'}
                            </div>
                            <div class="applicant-info">
                                <div class="applicant-name">${a.full_name || a.email}</div>
                                <div class="applicant-meta">${a.headline || ''}${a.location ? ' · ' + a.location : ''}</div>
                            </div>
                            <div class="applicant-date">${date}</div>
                            <a href="e_view_profile.html?id=${a.id}" class="btn-secondary btn-sm" style="text-decoration:none;white-space:nowrap;">View Profile</a>
                        </div>`;
                    }).join('');
                })
                .catch(() => {
                    const body = document.getElementById('applicants-body');
                    if (body) body.innerHTML = '<p style="color:var(--text-muted);font-size:0.9rem;">Could not load applicants.</p>';
                });
        }

        document.addEventListener('DOMContentLoaded', renderJobPage);
    </script>
</body>
</html>
