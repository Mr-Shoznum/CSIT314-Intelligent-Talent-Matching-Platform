<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search – ITMP</title>
    <link rel="stylesheet" href="../../assests/styling/global.css">
    <link rel="stylesheet" href="../../assests/styling/dashboard.css">
    <style>
        /* ── Layout ──────────────────────────────────────────────── */
        .search-main { padding: 2rem; align-items: flex-start; }
        .search-wrapper { width: 100%; max-width: 1200px; margin: 0 auto; }

        /* ── Search hero bar ─────────────────────────────────────── */
        .search-hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            border-radius: var(--radius-card);
            padding: 2rem 2.5rem;
            margin-bottom: 1.5rem;
            color: white;
        }
        .search-hero h1 { font-size: 1.5rem; margin-bottom: 1.25rem; text-align: left; color: white; }

        /* mode toggle */
        .mode-toggle {
            display: inline-flex;
            background: rgba(255,255,255,0.15);
            border-radius: 30px;
            padding: 4px;
            margin-bottom: 1.25rem;
            gap: 4px;
        }
        .mode-btn {
            padding: 0.45rem 1.25rem;
            border-radius: 24px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.75);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn.active { background: white; color: var(--primary); }

        /* search input row */
        .search-input-row {
            display: flex;
            gap: 0.75rem;
        }
        .search-input-row input {
            flex: 1;
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-btn);
            border: none;
            font-size: 1rem;
            outline: none;
        }
        .btn-search-main {
            background: white;
            color: var(--primary);
            border: none;
            padding: 0.75rem 1.75rem;
            border-radius: var(--radius-btn);
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .btn-search-main:hover { opacity: 0.9; }

        /* ── Body: sidebar + results ─────────────────────────────── */
        .search-body {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        /* ── Filter sidebar ──────────────────────────────────────── */
        .filter-sidebar { display: flex; flex-direction: column; gap: 1rem; }
        .filter-card { padding: 1.5rem; }
        .filter-card h3 {
            font-size: 0.95rem; font-weight: bold; color: var(--text-main);
            margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;
        }
        .filter-group { margin-bottom: 1.25rem; }
        .filter-group:last-child { margin-bottom: 0; }
        .filter-label {
            display: block; font-size: 0.78rem; text-transform: uppercase;
            letter-spacing: 0.5px; font-weight: bold; color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        .filter-group input[type="text"],
        .filter-group input[type="number"],
        .filter-group select {
            width: 100%; padding: 0.5rem 0.75rem;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-btn); font-size: 0.88rem;
            font-family: inherit; color: var(--text-main);
            box-sizing: border-box; outline: none;
            transition: border-color 0.2s;
        }
        .filter-group input:focus, .filter-group select:focus { border-color: var(--primary); }

        .check-list { display: flex; flex-direction: column; gap: 0.4rem; }
        .check-item {
            display: flex; align-items: center; gap: 0.5rem;
            font-size: 0.88rem; color: var(--text-main); cursor: pointer;
        }
        .check-item input[type="checkbox"] { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }

        .salary-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .salary-row input { text-align: center; }

        .filter-toggle {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 0.88rem; color: var(--text-main);
        }
        /* toggle switch */
        .toggle-switch { position: relative; width: 36px; height: 20px; }
        .toggle-switch input { display: none; }
        .toggle-slider {
            position: absolute; inset: 0;
            background: var(--border-color); border-radius: 20px;
            cursor: pointer; transition: background 0.2s;
        }
        .toggle-slider::after {
            content: ''; position: absolute; left: 3px; top: 3px;
            width: 14px; height: 14px; border-radius: 50%;
            background: white; transition: transform 0.2s;
        }
        .toggle-switch input:checked + .toggle-slider { background: var(--primary); }
        .toggle-switch input:checked + .toggle-slider::after { transform: translateX(16px); }

        .btn-clear-filters {
            width: 100%; background: none; border: 1.5px solid var(--border-color);
            color: var(--text-muted); padding: 0.5rem; border-radius: var(--radius-btn);
            font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .btn-clear-filters:hover { border-color: var(--primary); color: var(--primary); }

        /* ── Results area ────────────────────────────────────────── */
        .results-area { display: flex; flex-direction: column; gap: 1rem; }

        .results-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 0.25rem;
        }
        .results-count { font-size: 0.9rem; color: var(--text-muted); }
        .results-count strong { color: var(--text-main); }

        .sort-select {
            padding: 0.4rem 0.75rem; border: 1.5px solid var(--border-color);
            border-radius: var(--radius-btn); font-size: 0.85rem;
            font-family: inherit; color: var(--text-main); outline: none;
        }

        /* ── Job result card ─────────────────────────────────────── */
        .result-job-card { padding: 1.5rem; }
        .rjc-top {
            display: flex; gap: 1rem; align-items: flex-start; margin-bottom: 1rem;
        }
        .company-badge {
            width: 48px; height: 48px; border-radius: 10px;
            background: var(--primary); color: white;
            font-weight: bold; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .rjc-title-group { flex: 1; }
        .rjc-title { font-size: 1.1rem; font-weight: bold; color: var(--primary); margin-bottom: 0.15rem; }
        .rjc-title a { color: inherit; text-decoration: none; }
        .rjc-title a:hover { text-decoration: underline; }
        .rjc-company { font-size: 0.9rem; font-weight: bold; color: var(--text-muted); }
        .rjc-meta {
            display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.6rem 0;
        }
        .meta-tag {
            font-size: 0.8rem; background: var(--bg-light-hover);
            padding: 0.25rem 0.65rem; border-radius: 20px; color: var(--text-muted); font-weight: bold;
        }
        .rjc-skills { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.75rem 0; }
        .rjc-actions {
            display: flex; gap: 0.75rem; align-items: center;
            padding-top: 1rem; border-top: 1px solid var(--border-light);
        }

        /* ── Candidate result card ───────────────────────────────── */
        .result-candidate-card { padding: 1.5rem; }
        .rcc-top { display: flex; gap: 1rem; align-items: flex-start; }
        .cand-avatar {
            width: 56px; height: 56px; border-radius: 50%;
            color: white; font-weight: bold; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .cand-info { flex: 1; }
        .cand-name { font-size: 1.05rem; font-weight: bold; color: var(--text-main); }
        .cand-headline { font-size: 0.9rem; color: var(--text-muted); margin: 0.15rem 0; }
        .cand-meta { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
        .cand-skills { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.9rem 0; }
        .cand-actions {
            display: flex; gap: 0.75rem; align-items: center;
            padding-top: 1rem; border-top: 1px solid var(--border-light);
        }
        .avail-badge {
            padding: 0.25rem 0.7rem; border-radius: 20px;
            font-size: 0.78rem; font-weight: bold;
        }
        .avail-immediate { background: #e6ffe6; color: var(--success); border: 1px solid var(--success); }
        .avail-twoweeks  { background: #fff8e6; color: #b08000; border: 1px solid #f0c040; }
        .avail-month     { background: #f0f0f0; color: #555; border: 1px solid #ccc; }
        .open-to-work-dot {
            display: inline-block; width: 8px; height: 8px;
            background: var(--success); border-radius: 50; margin-right: 4px;
        }

        /* Empty / loading states */
        .results-empty { text-align: center; padding: 3rem 2rem; color: var(--text-muted); }
        .results-empty .empty-icon { font-size: 3rem; margin-bottom: 1rem; }

        /* ── Responsive ──────────────────────────────────────────── */
        @media (max-width: 860px) {
            .search-body { grid-template-columns: 1fr; }
            .filter-sidebar { order: 2; }
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="header-logo-link">
            <div class="itmp-logo-placeholder"></div>
            <span class="header-title">ITMP</span>
        </a>
        <div class="header-search" style="display:none;"></div>
        <div class="header-nav">
            <a href="c_dashboard.html">Dashboard</a>
            <a href="profile.html">My Profile</a>
            <a href="login.html">Sign Out</a>
        </div>
    </header>

    <main class="search-main dashboard-main">
        <div class="search-wrapper">

            <!-- Search Hero -->
            <div class="search-hero">
                <h1 id="hero-title">Find your next opportunity</h1>
                <div class="mode-toggle">
                    <button class="mode-btn active" id="btn-mode-jobs"     onclick="setMode('jobs')">🔍 Find Jobs</button>
                    <button class="mode-btn"         id="btn-mode-candidates" onclick="setMode('candidates')">👥 Find Candidates</button>
                </div>
                <div class="search-input-row">
                    <input type="text" id="main-search" placeholder="Search by title, skill, company or location…"
                           onkeydown="if(event.key==='Enter') runSearch()">
                    <button class="btn-search-main" onclick="runSearch()">Search</button>
                </div>
            </div>

            <div class="search-body">

                <!-- ── Filter Sidebar ── -->
                <aside class="filter-sidebar">

                    <!-- JOB FILTERS -->
                    <div class="filter-card card" id="job-filters">
                        <h3>🎛 Filters</h3>

                        <div class="filter-group">
                            <label class="filter-label">Location</label>
                            <input type="text" id="jf-location" placeholder="e.g. Sydney" oninput="runSearch()">
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">Work Mode</label>
                            <div class="check-list">
                                <label class="check-item"><input type="checkbox" value="Remote"  onchange="runSearch()"> Remote</label>
                                <label class="check-item"><input type="checkbox" value="Hybrid"  onchange="runSearch()"> Hybrid</label>
                                <label class="check-item"><input type="checkbox" value="On-site" onchange="runSearch()"> On-site</label>
                            </div>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">Salary Range (AUD)</label>
                            <div class="salary-row">
                                <input type="number" id="jf-sal-min" placeholder="Min" step="5000" oninput="runSearch()">
                                <input type="number" id="jf-sal-max" placeholder="Max" step="5000" oninput="runSearch()">
                            </div>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">Job Type</label>
                            <div class="check-list">
                                <label class="check-item"><input type="checkbox" value="Full-time"  onchange="runSearch()"> Full-time</label>
                                <label class="check-item"><input type="checkbox" value="Part-time"  onchange="runSearch()"> Part-time</label>
                                <label class="check-item"><input type="checkbox" value="Contract"   onchange="runSearch()"> Contract</label>
                            </div>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">Industry</label>
                            <select id="jf-industry" onchange="runSearch()">
                                <option value="">All Industries</option>
                                <option>Software / SaaS</option>
                                <option>Data & Analytics</option>
                                <option>Cloud Infrastructure</option>
                                <option>Fintech / Data</option>
                                <option>Digital Agency</option>
                                <option>Healthcare</option>
                                <option>E-commerce</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">Minimum Match Score</label>
                            <select id="jf-match" onchange="runSearch()">
                                <option value="">Any</option>
                                <option value="50">50%+</option>
                                <option value="70">70%+</option>
                                <option value="80">80%+</option>
                                <option value="90">90%+</option>
                            </select>
                        </div>

                        <button class="btn-clear-filters" onclick="clearFilters()">Clear all filters</button>
                    </div>

                    <!-- CANDIDATE FILTERS -->
                    <div class="filter-card card" id="candidate-filters" style="display:none;">
                        <h3>🎛 Filters</h3>

                        <div class="filter-group">
                            <label class="filter-label">Location</label>
                            <input type="text" id="cf-location" placeholder="e.g. Sydney" oninput="runSearch()">
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">Work Mode</label>
                            <div class="check-list" id="cf-workmode-list">
                                <label class="check-item"><input type="checkbox" value="Remote"  onchange="runSearch()"> Remote</label>
                                <label class="check-item"><input type="checkbox" value="Hybrid"  onchange="runSearch()"> Hybrid</label>
                                <label class="check-item"><input type="checkbox" value="On-site" onchange="runSearch()"> On-site</label>
                            </div>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">Years of Experience</label>
                            <div class="salary-row">
                                <input type="number" id="cf-yoe-min" placeholder="Min" min="0" oninput="runSearch()">
                                <input type="number" id="cf-yoe-max" placeholder="Max" min="0" oninput="runSearch()">
                            </div>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">Availability</label>
                            <select id="cf-avail" onchange="runSearch()">
                                <option value="">Any</option>
                                <option>Immediate</option>
                                <option>2 weeks</option>
                                <option>1 month</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">Skills (comma-separated)</label>
                            <input type="text" id="cf-skills" placeholder="e.g. Python, React" oninput="runSearch()">
                        </div>

                        <div class="filter-group">
                            <div class="filter-toggle">
                                <span>Open to work only</span>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="cf-open" onchange="runSearch()">
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                        </div>

                        <button class="btn-clear-filters" onclick="clearFilters()">Clear all filters</button>
                    </div>
                </aside>

                <!-- ── Results ── -->
                <div class="results-area">
                    <div class="results-header">
                        <div class="results-count" id="results-count">Showing <strong>0</strong> results</div>
                        <select class="sort-select" id="sort-select" onchange="runSearch()">
                            <option value="match">Best Match</option>
                            <option value="salary_desc">Salary: High to Low</option>
                            <option value="salary_asc">Salary: Low to High</option>
                            <option value="newest">Newest First</option>
                            <option value="applicants">Fewest Applicants</option>
                        </select>
                    </div>
                    <div id="results-list"></div>
                </div>

            </div>
        </div>
    </main>

    <footer class="minimal-footer">
        <div class="footer-links"><a href="#">Terms of Service</a><a href="#">Privacy Policy</a></div>
        <div class="footer-copyright">&copy; 2026 ITMP. All rights reserved.</div>
    </footer>

    <script src="../../../back-end/scripting/js-scripts/data.js"></script>
    <script>
        // ── State ─────────────────────────────────────────────────────
        let _mode = 'jobs'; // 'jobs' | 'candidates'

        // ── Mode switching ────────────────────────────────────────────
        function setMode(mode) {
            _mode = mode;
            document.getElementById('btn-mode-jobs').classList.toggle('active', mode === 'jobs');
            document.getElementById('btn-mode-candidates').classList.toggle('active', mode === 'candidates');
            document.getElementById('job-filters').style.display       = mode === 'jobs'       ? '' : 'none';
            document.getElementById('candidate-filters').style.display = mode === 'candidates' ? '' : 'none';
            document.getElementById('sort-select').style.display       = mode === 'jobs'       ? '' : 'none';
            document.getElementById('hero-title').textContent = mode === 'jobs'
                ? 'Find your next opportunity' : 'Find talented candidates';
            document.getElementById('main-search').placeholder = mode === 'jobs'
                ? 'Search by title, skill, company or location…'
                : 'Search by name, skill or location…';
            runSearch();
        }

        // ── Collect filters ───────────────────────────────────────────
        function getJobFilters() {
            const checks = group => [...document.querySelectorAll(`#${group} input[type=checkbox]:checked`)].map(c => c.value);
            return {
                query:    document.getElementById('main-search').value,
                location: document.getElementById('jf-location').value,
                workMode: checks('job-filters'),
                jobType:  [...document.querySelectorAll('#job-filters .check-list:nth-of-type(2) input:checked')].map(c => c.value),
                industry: document.getElementById('jf-industry').value,
                salaryMin: +document.getElementById('jf-sal-min').value || null,
                salaryMax: +document.getElementById('jf-sal-max').value || null,
                matchMin:  +document.getElementById('jf-match').value   || null,
            };
        }

        function getCandidateFilters() {
            const workModes = [...document.querySelectorAll('#candidate-filters input[type=checkbox]:not(#cf-open):checked')].map(c => c.value);
            const skillRaw  = document.getElementById('cf-skills').value;
            return {
                query:        document.getElementById('main-search').value,
                location:     document.getElementById('cf-location').value,
                workMode:     workModes,
                yoeMin:       +document.getElementById('cf-yoe-min').value || null,
                yoeMax:       +document.getElementById('cf-yoe-max').value || null,
                availability: document.getElementById('cf-avail').value,
                openToWork:   document.getElementById('cf-open').checked,
                skills:       skillRaw ? skillRaw.split(',').map(s => s.trim()).filter(Boolean) : [],
            };
        }

        // ── Sort jobs ─────────────────────────────────────────────────
        function sortJobs(jobs) {
            const sort = document.getElementById('sort-select').value;
            return [...jobs].sort((a, b) => {
                if (sort === 'salary_desc')  return b.salary_max - a.salary_max;
                if (sort === 'salary_asc')   return a.salary_min - b.salary_min;
                if (sort === 'newest')       return new Date(b.posted_date) - new Date(a.posted_date);
                if (sort === 'applicants')   return a.applications_count - b.applications_count;
                return b.match_score - a.match_score; // 'match' default
            });
        }

        // ── Render ────────────────────────────────────────────────────
        function runSearch() {
            DataService.onReady(() => {
                if (_mode === 'jobs') renderJobResults();
                else                  renderCandidateResults();
            });
        }

        function renderJobResults() {
            const filters = getJobFilters();
            // Fix: jobType checkboxes are inside the 2nd .check-list
            const jobTypeCbs = [...document.querySelectorAll('#job-filters .check-list')];
            filters.workMode = jobTypeCbs[0] ? [...jobTypeCbs[0].querySelectorAll('input:checked')].map(c => c.value) : [];
            filters.jobType  = jobTypeCbs[1] ? [...jobTypeCbs[1].querySelectorAll('input:checked')].map(c => c.value) : [];

            const jobs    = sortJobs(DataService.searchJobs(filters));
            const list    = document.getElementById('results-list');
            const user    = DataService.getCurrentUser();
            const applied = user?.applied_jobs ?? [];
            const saved   = user?.saved_jobs   ?? [];

            document.getElementById('results-count').innerHTML =
                `Showing <strong>${jobs.length}</strong> job${jobs.length !== 1 ? 's' : ''}`;

            if (jobs.length === 0) {
                list.innerHTML = `<div class="results-empty"><div class="empty-icon">🔍</div><p>No jobs match your search. Try adjusting your filters.</p></div>`;
                return;
            }

            const userSkills = (user?.skills ?? []).map(s => s.toLowerCase());
            list.innerHTML = jobs.map(job => {
                const skillChips = job.skills.map(s =>
                    `<span class="skill-tag ${userSkills.includes(s.name.toLowerCase()) ? 'match' : ''}">${s.name}</span>`
                ).join('');
                const isApplied = applied.includes(job.id);
                const isSaved   = saved.includes(job.id);
                const actionBtn = isApplied
                    ? `<button class="btn-applied" disabled>✔ Applied</button>`
                    : `<button class="btn-primary btn-sm" onclick="doApply('${job.id}')">One-Click Apply</button>`;
                const saveBtn = isSaved
                    ? `<button class="btn-text" onclick="doSave('${job.id}')" style="color:var(--primary);">★ Saved</button>`
                    : `<button class="btn-text" onclick="doSave('${job.id}')">☆ Save</button>`;

                return `
                <div class="card result-job-card">
                    <div class="rjc-top">
                        <div class="company-badge">${job.company_initials}</div>
                        <div class="rjc-title-group">
                            <div class="rjc-title"><a href="job.html?id=${job.id}">${job.title}</a></div>
                            <div class="rjc-company">${job.company}</div>
                            <div class="rjc-meta">
                                <span class="meta-tag">📍 ${job.location}</span>
                                <span class="meta-tag">🖥️ ${job.work_mode}</span>
                                <span class="meta-tag">💰 ${job.salary_display}</span>
                                <span class="meta-tag">💼 ${job.job_type}</span>
                            </div>
                        </div>
                        <div class="match-score">${job.match_score}% Match</div>
                    </div>
                    <div class="rjc-skills">${skillChips}</div>
                    <div class="rjc-actions">
                        ${actionBtn}
                        ${saveBtn}
                        <a href="job.html?id=${job.id}" class="btn-text" style="margin-left:auto;">View details →</a>
                    </div>
                </div>`;
            }).join('');
        }

        function renderCandidateResults() {
            const filters    = getCandidateFilters();
            const candidates = DataService.searchCandidates(filters);
            const list       = document.getElementById('results-list');

            document.getElementById('results-count').innerHTML =
                `Showing <strong>${candidates.length}</strong> candidate${candidates.length !== 1 ? 's' : ''}`;

            if (candidates.length === 0) {
                list.innerHTML = `<div class="results-empty"><div class="empty-icon">👥</div><p>No candidates match your filters. Try broadening your search.</p></div>`;
                return;
            }

            const availClass = a =>
                a === 'Immediate' ? 'avail-immediate' : a === '2 weeks' ? 'avail-twoweeks' : 'avail-month';

            list.innerHTML = candidates.map(c => {
                const topSkills = c.skills.slice(0, 6).map(s =>
                    `<span class="skill-tag">${s}</span>`).join('');
                return `
                <div class="card result-candidate-card">
                    <div class="rcc-top">
                        <div class="cand-avatar" style="background:${c.avatar_color}">${c.avatar_initials}</div>
                        <div class="cand-info">
                            <div class="cand-name">${c.full_name}
                                ${c.open_to_work ? '<span style="font-size:0.78rem;color:var(--success);font-weight:bold;margin-left:0.5rem;"><span class="open-to-work-dot"></span>Open to work</span>' : ''}
                            </div>
                            <div class="cand-headline">${c.headline}</div>
                            <div class="cand-meta">
                                <span class="meta-tag">📍 ${c.location}</span>
                                <span class="meta-tag">🖥️ ${c.work_mode_preference}</span>
                                <span class="meta-tag">💼 ${c.yoe} yrs exp</span>
                                <span class="avail-badge ${availClass(c.availability)}">⏱ ${c.availability}</span>
                            </div>
                        </div>
                    </div>
                    <div class="cand-skills">${topSkills}</div>
                    <div class="cand-actions">
                        <button class="btn-primary btn-sm">Invite to Apply</button>
                        <button class="btn-secondary btn-sm">Save Candidate</button>
                        <span style="margin-left:auto;font-size:0.8rem;color:var(--text-muted);">👁 ${c.profile_views} profile views</span>
                    </div>
                </div>`;
            }).join('');
        }

        // ── Action handlers ───────────────────────────────────────────
        function doApply(jobId) { DataService.applyForJob(jobId); runSearch(); }
        function doSave(jobId)  { DataService.toggleSaveJob(jobId); runSearch(); }

        function clearFilters() {
            document.querySelectorAll('.filter-card input[type=text]').forEach(i => i.value = '');
            document.querySelectorAll('.filter-card input[type=number]').forEach(i => i.value = '');
            document.querySelectorAll('.filter-card input[type=checkbox]').forEach(i => i.checked = false);
            document.querySelectorAll('.filter-card select').forEach(s => s.selectedIndex = 0);
            runSearch();
        }

        // ── Boot ──────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            // Read ?q= and ?mode= from URL
            const params = new URLSearchParams(window.location.search);
            if (params.get('q'))    document.getElementById('main-search').value = params.get('q');
            if (params.get('mode') === 'candidates') setMode('candidates');
            DataService.onReady(() => runSearch());
        });
    </script>
</body>
</html>
