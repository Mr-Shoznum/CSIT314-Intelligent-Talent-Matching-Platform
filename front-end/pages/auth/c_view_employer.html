<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Profile – ITMP</title>
    <link rel="stylesheet" href="../../assests/styling/global.css">
    <link rel="stylesheet" href="../../assests/styling/dashboard.css">
    <link rel="icon" type="image/x-icon" href="../../assests/images/ITMP-icon-logo.ico">
    <style>
        .employer-page-main { padding: 2rem; flex-direction: column; align-items: center; justify-content: flex-start; }
        .employer-page-wrapper { width: 100%; max-width: 1100px; }
        .employer-page-container { width: 100%; display: grid; grid-template-columns: 1fr 300px; gap: 2rem; align-items: start; }
        .back-link { display: block; align-items: center; gap: 0.4rem; color: var(--primary); font-weight: bold; font-size: 0.9rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { text-decoration: underline; }
        .ep-hero-card { padding: 2rem; }
        .ep-hero-top { display: flex; gap: 1.5rem; align-items: flex-start; }
        .ep-badge { width: 80px; height: 80px; border-radius: 16px; color: white; font-weight: bold; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .ep-title-group { flex: 1; }
        .ep-title-group h1 { font-size: 1.7rem; color: var(--text-main); margin-bottom: 0.3rem; text-align: left; }
        .ep-badges { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
        .meta-badge { display: inline-flex; align-items: center; gap: 0.3rem; background-color: var(--bg-light-hover); color: var(--text-muted); padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.82rem; font-weight: bold; }
        .verified-badge { color: var(--success); border: 1px solid var(--success); background: #e6ffe6; }
        .ep-section { padding: 1.75rem; }
        .ep-section h2 { font-size: 1rem; font-weight: bold; color: var(--text-main); margin-bottom: 1rem; padding-bottom: 0.6rem; border-bottom: 2px solid var(--border-light); }
        .ep-about-text { font-size: 0.95rem; color: var(--text-muted); line-height: 1.75; }
        .ep-job-item { display: flex; align-items: center; gap: 1rem; padding: 0.9rem 0; border-bottom: 1px solid var(--border-light); text-decoration: none; }
        .ep-job-item:last-child { border-bottom: none; padding-bottom: 0; }
        .ep-job-item:first-child { padding-top: 0; }
        .ep-job-badge { width: 40px; height: 40px; border-radius: 8px; background: var(--primary); color: white; font-weight: bold; font-size: 0.82rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .ep-job-info { flex: 1; }
        .ep-job-title { font-weight: bold; color: var(--text-main); font-size: 0.95rem; }
        .ep-job-meta  { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.2rem; }
        .ep-job-item:hover .ep-job-title { color: var(--primary); text-decoration: underline; }
        .ep-info-card { padding: 1.75rem; }
        .ep-info-card h3 { font-size: 1rem; font-weight: bold; margin-bottom: 1rem; color: var(--text-main); }
        .ep-info-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 0.55rem 0; border-bottom: 1px solid var(--border-light); font-size: 0.85rem; }
        .ep-info-row:last-child { border-bottom: none; }
        .ep-info-row .ep-label { color: var(--text-muted); white-space: nowrap; margin-right: 1rem; }
        .ep-info-row .ep-value { font-weight: bold; color: var(--text-main); text-align: right; word-break: break-word; }
        .ep-info-row .ep-value a { color: var(--primary); text-decoration: none; }
        .ep-info-row .ep-value a:hover { text-decoration: underline; }
        .not-found { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
        @media (max-width: 860px) { .employer-page-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <a href="c_dashboard.html" class="header-logo-link">
            <div class="itmp-logo-placeholder"><img src="../../assests/images/ITMP.png" style="max-width: 100px;"></div>
        </a>
        <div class="header-search">
            <input type="text" placeholder="Search jobs or employers…" class="quick-search-input" id="header-search">
            <button class="btn-search-small"
                onclick="window.location.href='c_search_result.html?mode=employers&q='+encodeURIComponent(document.getElementById('header-search').value)">Search</button>
        </div>
        <div class="header-nav">
            <a href="c_dashboard.html">Dashboard</a>
            <a href="c_search_result.html">Browse Jobs</a>
            <a href="c_settings.html">Settings</a>
            <a href="#" onclick="DataService.logout();return false;">Sign Out</a>
        </div>
    </header>

    <main class="employer-page-main dashboard-main">
        <div class="employer-page-wrapper">
            <a href="c_search_result.html?mode=employers" class="back-link">← Back to Employers</a>
            <div class="employer-page-container" id="employer-root"></div>
            <div class="not-found" id="not-found" style="display:none;">
                <h2>Employer Not Found</h2>
                <p>This profile may no longer be available.</p>
                <a href="c_search_result.html?mode=employers" class="btn-primary" style="display:inline-block;margin-top:1rem;">Browse Employers</a>
            </div>
        </div>
    </main>

    <footer class="minimal-footer">
        <div class="footer-links"><a href="#">Terms of Service</a><a href="#">Privacy Policy</a><a href="#">Candidate Terms</a></div>
        <div class="footer-copyright">&copy; 2026 ITMP. All rights reserved.</div>
    </footer>

    <script src="../../assests/js/data.js"></script>
    <script>
        function renderEmployerPage() {
            DataService.onReady(() => {
                const id   = parseInt(new URLSearchParams(window.location.search).get('id'));
                const e    = DataService.getEmployerById && DataService.getEmployerById(id);
                const root = document.getElementById('employer-root');

                if (!e) {
                    root.style.display = 'none';
                    document.getElementById('not-found').style.display = 'block';
                    return;
                }

                document.title = `${e.company_name} – ITMP`;

                const jobs = (DataService.getAllJobs ? DataService.getAllJobs() : []).filter(j => j.employer_id === e.id);

                const jobsHtml = jobs.length > 0
                    ? jobs.map(j => `
                        <a href="c_view_job.html?id=${j.id}" class="ep-job-item">
                            <div class="ep-job-badge">${j.company_initials}</div>
                            <div class="ep-job-info">
                                <div class="ep-job-title">${j.title}</div>
                                <div class="ep-job-meta">📍 ${j.location} &nbsp;|&nbsp; 🖥️ ${j.work_mode} &nbsp;|&nbsp; 💰 ${j.salary_display} &nbsp;|&nbsp; 💼 ${j.job_type}</div>
                            </div>
                            <span class="meta-badge">${j.match_score ? j.match_score + '% Match' : 'View →'}</span>
                        </a>`).join('')
                    : '<p style="color:var(--text-muted);font-style:italic;font-size:0.9rem;">No open positions at this time.</p>';

                const websiteHref = e.website ? (/^https?:\/\//i.test(e.website) ? e.website : 'https://' + e.website) : null;

                root.innerHTML = `
                    <div style="display:flex;flex-direction:column;gap:1.5rem;">
                        <div class="card ep-hero-card">
                            <div class="ep-hero-top">
                                <div class="ep-badge" style="background:${e.avatar_color}">${e.avatar_initials}</div>
                                <div class="ep-title-group">
                                    <h1>${e.company_name}</h1>
                                    <div class="ep-badges">
                                        ${e.industry   ? `<span class="meta-badge">🏭 ${e.industry}</span>` : ''}
                                        ${e.location   ? `<span class="meta-badge">📍 ${e.location}</span>` : ''}
                                        ${e.is_verified ? `<span class="meta-badge verified-badge">✔ Verified</span>` : ''}
                                        <span class="meta-badge">💼 ${jobs.length} open position${jobs.length !== 1 ? 's' : ''}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        ${e.description ? `
                        <div class="card ep-section">
                            <h2>About ${e.company_name}</h2>
                            <p class="ep-about-text">${e.description}</p>
                        </div>` : ''}

                        <div class="card ep-section">
                            <h2>💼 Open Positions (${jobs.length})</h2>
                            ${jobsHtml}
                        </div>
                    </div>

                    <div style="display:flex;flex-direction:column;gap:1.5rem;">
                        <div class="card ep-info-card">
                            <h3>Company Details</h3>
                            ${e.industry  ? `<div class="ep-info-row"><span class="ep-label">Industry</span><span class="ep-value">${e.industry}</span></div>` : ''}
                            ${e.location  ? `<div class="ep-info-row"><span class="ep-label">Location</span><span class="ep-value">${e.location}</span></div>` : ''}
                            ${websiteHref ? `<div class="ep-info-row"><span class="ep-label">Website</span><span class="ep-value"><a href="${websiteHref}" target="_blank" rel="noopener">${e.website}</a></span></div>` : ''}
                            ${e.abn       ? `<div class="ep-info-row"><span class="ep-label">ABN</span><span class="ep-value">${e.abn}</span></div>` : ''}
                            <div class="ep-info-row"><span class="ep-label">Open Positions</span><span class="ep-value">${jobs.length}</span></div>
                        </div>

                        ${jobs.length > 0 ? `
                        <a href="c_search_result.html?mode=jobs&q=${encodeURIComponent(e.company_name)}"
                           class="btn-primary" style="display:block;text-align:center;text-decoration:none;padding:0.85rem;border-radius:var(--radius-btn);">
                            Browse All Jobs from ${e.company_name}
                        </a>` : ''}
                    </div>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', renderEmployerPage);
    </script>
</body>
</html>
