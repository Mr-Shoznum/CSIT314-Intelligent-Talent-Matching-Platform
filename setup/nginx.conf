server {
    listen 80;
    server_name localhost;

    # Static files root — the front-end directory
    root /home/jordanmilevski/Documents/University/computer_science/year3/semester1/CSIT314/2026/Assigment/v3/CSIT314-Intelligent-Talent-Matching-Platform-main/front-end;

    # Default landing page
    location = / {
        return 302 /pages/login.html;
    }

    # Proxy all API calls to the Node.js backend
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Serve static files; fall back to 404
    location / {
        try_files $uri $uri/ =404;
    }
}
