server {
    listen 80;
    server_name localhost;

    # Static front-end root — substituted by setup/install.sh
    root __FRONTEND_ROOT__;

    # Default landing page — redirect to login
    location = / {
        return 302 /pages/login.html;
    }

    # Proxy all /api/ calls to the Node.js backend (port 3000)
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Serve static files; 404 on miss
    location / {
        try_files $uri $uri/ =404;
    }

    # Hide dot-files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
