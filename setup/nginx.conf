server {
    listen 80;
    server_name _;          # catch-all — works on any IP/hostname

    client_max_body_size 20M;   # allow resume/file uploads up to 20 MB

    root __FRONTEND_ROOT__;

    # ── Redirect bare root to login ───────────────────────────────────
    location = / {
        return 302 /pages/login.html;
    }

    # ── API — proxy to Node.js backend ───────────────────────────────
    # NO trailing slash: /api/ prefix is preserved so Node routes match
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Static files ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ── Block hidden files (.env, .git, etc.) ─────────────────────────
    location ~ /\. {
        deny all;
    }
}
